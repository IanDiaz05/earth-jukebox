services:
  db:
    image: postgres:18-alpine
    container_name: spotiearth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spotiearth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotiearth_dev}
      POSTGRES_DB: ${POSTGRES_DB:-spotiearth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotiearth-api
    restart: "no"
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-spotiearth}:${POSTGRES_PASSWORD:-spotiearth_dev}@db:5432/${POSTGRES_DB:-spotiearth}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started

volumes:
  postgres_data:
    driver: local
