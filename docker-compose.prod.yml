services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - spotiearth-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["*"]}
      DEFAULT_RATE_LIMIT: ${DEFAULT_RATE_LIMIT:-60/minute}
      PROJECT_NAME: ${PROJECT_NAME:-SpotiEarth API}
      VERSION: ${VERSION:-0.1.0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spotiearth-internal
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  spotiearth-internal:
    driver: bridge
    internal: true
  dokploy-network:
    external: true

volumes:
  postgres_data:
    driver: local
